name: CI - Frontend

# PR이 열리거나 갱신될 때만 실행 (매 push마다 도는 게 아니라 조용히 있다가 PR에서만 동작).
# 실패했을 때만 알림 받고 싶으면 GitHub 개인 설정(Settings > Notifications > Actions)에서
# "Only notify for failed workflows"로 바꾸면 됨.
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
