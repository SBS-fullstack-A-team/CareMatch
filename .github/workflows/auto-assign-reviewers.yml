name: Auto-assign reviewers                                                                                                                                                                        
                                                                                                                                                                                                     
on:                                                                                                                                                                                                
    pull_request:                                                                                                                                                                                    
      types: [opened, reopened, ready_for_review]                                                                                                                                                    
                                                                                                                                                                                                     
permissions:                                                                                                                                                                                       
    pull-requests: write                                                                                                                                                                             
                                                                                                                                                                                                     
jobs:                                                                                                                                                                                              
    assign:                                                                                                                                                                                          
      runs-on: ubuntu-latest                                                                                                                                                                         
      if: github.event.pull_request.draft == false                                                                                                                                                   
      steps:                                                                                                                                                                                         
        - name: Request reviews by branch role                                                                                                                                                       
          env:                                                                                                                                                                                       
            GH_TOKEN: ${{ github.token }}                                                                                                                                                            
            REPO: ${{ github.repository }}                                                                                                                                                           
            PR: ${{ github.event.pull_request.number }}                                                                                                                                              
            AUTHOR: ${{ github.event.pull_request.user.login }}                                                                                                                                      
            HEAD_REF: ${{ github.event.pull_request.head.ref }}                                                                                                                                      
          run: |                                                                                                                                                                                     
            set -euo pipefail

            case "$HEAD_REF" in                                                                                                                                                                      
              feature/fe-*) CANDIDATES="syyu21b Kim-dong-han" ;;                                                                                                                                     
              feature/be-*) CANDIDATES="heo-hyuk HurKyungsoo" ;;                                                                                                                                     
              *)            CANDIDATES="heo-hyuk" ;;                                                                                                                                                 
            esac                                                                                                                                                                                     
                                                                                                                                                                                                     
            REVIEWERS=""                                                                                                                                                                             
            for u in $CANDIDATES; do                                                                                                                                                                 
              [ "$u" = "$AUTHOR" ] && continue                                                                                                                                                       
              REVIEWERS="${REVIEWERS:+$REVIEWERS,}$u"                                                                                                                                                
            done                                                                                                                                                                                     
                                                                                                                                                                                                     
            if [ -z "$REVIEWERS" ]; then                                                                                                                                                             
              echo "지정할 리뷰어가 없습니다 (작성자가 유일한 후보)."                                                                                                                                
              exit 0                                                                                                                                                                                 
            fi                                                                                                                                                                                       
                                                                                                                                                                                                     
            echo "리뷰어 지정: $REVIEWERS"                                                                                                                                                           
            gh pr edit "$PR" --repo "$REPO" --add-reviewer "$REVIEWERS" 
