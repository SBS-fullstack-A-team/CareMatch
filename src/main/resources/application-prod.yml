# Render 배포 기준. Render 자체 관리형 DB는 PostgreSQL만 지원하므로,
# 팀 규칙(MySQL/MariaDB)을 지키려면 PlanetScale, Railway, 또는 Render Private Service로
# 직접 띄운 MySQL 등 외부 호스팅을 SPRING_DATASOURCE_URL에 연결해야 한다.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # MariaDB를 쓰는 경우 org.hibernate.dialect.MariaDBDialect로 교체
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000
