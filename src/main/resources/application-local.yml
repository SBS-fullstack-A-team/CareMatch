spring:
  datasource:
    url: jdbc:h2:mem:carematch;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: local-dev-secret-key-please-make-this-longer-than-32-bytes-1234567890
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000
