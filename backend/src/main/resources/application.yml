# ==========================================================================
# 공통 설정 (모든 프로필 공유)
# - 실제 접속정보/시크릿은 절대 여기 두지 않는다. 전부 환경변수(${...})로 주입.
# - DB 벤더 미확정: datasource url/driver/dialect 는 프로필별 파일에서 채운다.
# - 파일 스토리지 미확정: storage.* 키 이름만 정의하고 스텁 구현체가 사용.
# ==========================================================================

# 서버 포트: 배포 플랫폼(Render 등)이 주입하는 PORT 환경변수를 사용.
# 로컬 개발은 PORT 가 없으므로 기본값 8080.
server:
  port: ${PORT:8080}

spring:
  application:
    name: carematch
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:dummy}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:dummy}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE:http://localhost:8080}/login/oauth2/code/naver"
            scope:
              - name
              - email
          kakao:
            client-id: ${OAUTH_KAKAO_CLIENT_ID:dummy}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:dummy}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE:http://localhost:8080}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:dummy}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:dummy}
            scope:
              - profile
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# ----- 애플리케이션 커스텀 설정 -----
carematch:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-override-with-at-least-64-bytes-000000}
    access-token-validity-seconds: ${JWT_ACCESS_TTL:1800}      # 30분
    refresh-token-validity-seconds: ${JWT_REFRESH_TTL:1209600}  # 14일
    issuer: carematch

  cors:
    # 허용 origin 패턴. 콤마로 구분. (setAllowedOriginPatterns 이므로 서브도메인 * 사용 가능)
    # 기본값은 로컬 프론트 개발 서버(Vite 5173 / CRA 3000). 운영은 CORS_ALLOWED_ORIGINS 로 Vercel 도메인 주입.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  oauth2:
    # 소셜 로그인 성공/실패 후 프론트(React)로 돌려보낼 주소.
    # 성공 시 토큰과 회원유형 선택 필요 여부를 쿼리파라미터로 전달.
    success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT:http://localhost:3000/oauth/callback}
    failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT:http://localhost:3000/login?error=oauth}

  security:
    login:
      max-fail-count: ${LOGIN_MAX_FAIL:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}

  storage:
    # 스토리지 벤더 미확정(R2 등 후보). 키 이름만 선점. 스텁 구현체가 참조.
    provider: ${STORAGE_PROVIDER:stub}
    bucket: ${STORAGE_BUCKET:carematch-dev}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://files.example.invalid}
    presign-expiry-seconds: ${STORAGE_PRESIGN_TTL:600}
    max-upload-size-bytes: ${STORAGE_MAX_UPLOAD_BYTES:5242880} # 5MB
    allowed-content-types: image/jpeg,image/png,application/pdf

  support:
    tel: ${SUPPORT_TEL:1600-0000}
    kakao-channel-url: ${SUPPORT_KAKAO_URL:https://pf.kakao.com/_carematch}
    operating-hours: "평일 09:00~18:00 (점심 12:00~13:00 제외)"
