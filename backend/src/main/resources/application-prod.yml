# ==========================================================================
# prod 프로필: Render 배포용. 모든 값은 환경변수로 주입된다.
# DB 벤더 미확정 → 아래 datasource 값들은 플레이스홀더. 확정 시 실제 값 주입.
#   - PostgreSQL 계열이 유력하나 확정 아님.
#   - DB_URL 예시(Postgres): jdbc:postgresql://<host>:5432/<db>
#   - DB_DRIVER 예시: org.postgresql.Driver
#   - DB_DIALECT 예시: org.hibernate.dialect.PostgreSQLDialect
# ==========================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  # DB 마이그레이션: Flyway 가 담당. classpath:db/migration/V*.sql
  # - baseline-on-migrate: 이미 스키마가 있는 기존 Neon DB 에 최초 도입 → flyway_schema_history 가
  #   없으면 baseline-version(=1) 을 "적용됨"으로 기록만 하고 V1 은 실행하지 않는다. 이후 V2+ 만 실행.
  # - 빈 DB(신규 환경)에서는 V1 부터 순서대로 실행된다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      # 스키마는 Flyway 가 관리. Hibernate 는 검증만 (엔티티 ↔ 실제 테이블 불일치 시 기동 실패).
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false

server:
  forward-headers-strategy: framework  # Render 프록시 뒤 https 인식

logging:
  level:
    root: INFO
    com.carematch: INFO
